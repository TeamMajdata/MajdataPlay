<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="666" viewBox="0 0 1200 666" role="img" aria-labelledby="title description">
  <title id="title">MajdataPlay Oniimai overview</title>
  <desc id="description">Native Android integration. An Oniimai USB controller supplies touch and IO4 button input and receives RGB lighting. MajdataPlay renders the game on a rotated external display while the phone shows configurable statistics widgets. Rendering defaults to 60fps with an optional 120fps target; actual output refresh rate depends on hardware.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#7894A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #EDF3F8; }
    .muted { fill: #B2C0CD; }
    .accent { fill: #71D7C5; }
    .gold { fill: #E8CE91; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; }
    .body { font-size: 17px; }
    .small { font-size: 15px; }
    .wire { fill: none; stroke: #7894A6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
