name: Validate iOS signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-smoke:
    name: Exercise the iOS signing keychain
    runs-on: [self-hosted, macOS, ARM64, majplay-ios]
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/signing-smoke
    steps:
      - name: Checkout the signing helper
        uses: actions/checkout@v4
        with:
          path: signing-smoke
          sparse-checkout: Tools/CI
          clean: false
      - name: Prepare temporary signing keychain
        id: signing-keychain
        run: |
          CI_KEYCHAIN="$RUNNER_TEMP/majplay-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "CI_KEYCHAIN=$CI_KEYCHAIN" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "password=$KEYCHAIN_PASSWORD" >> "$GITHUB_OUTPUT"
      - name: Import Apple certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          keychain: ${{ env.CI_KEYCHAIN }}
          keychain-password: ${{ steps.signing-keychain.outputs.password }}
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          directory = Path.home() / "Library/MobileDevice/Provisioning Profiles"
          directory.mkdir(parents=True, exist_ok=True)
          (directory / "appstore.mobileprovision").write_bytes(base64.b64decode(os.environ["PROFILE_BASE64"]))
          PY
      - name: Exercise default and explicit keychain signing
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, "Tools/CI")
          import prepare_ios_signing

          def diagnose(command, **kwargs):
              if command[0] != "/usr/bin/codesign" or command[1] != "--force":
                  return subprocess.run(command, **kwargs)
              fingerprint = command[3]
              keychain = os.environ["CI_KEYCHAIN"] + ".keychain"
              variants = [
                  ("default-lowercase", command),
                  ("default-uppercase", command[:3] + [fingerprint.upper()] + command[4:]),
                  ("explicit-keychain", command[:3] + [fingerprint.upper(), "--keychain", keychain] + command[4:]),
              ]
              success = None
              for name, candidate in variants:
                  options = dict(kwargs, check=False)
                  result = subprocess.run(candidate, **options)
                  markers = [text for text in ("errSecInternalComponent", "unable to build chain",
                             "User interaction is not allowed", "not found", "could not be found")
                             if text.lower() in result.stderr.lower()]
                  print("SIGNING", name, "exit", result.returncode, "diagnostics", markers, flush=True)
                  if result.returncode == 0:
                      success = candidate
              for domain in ("default", "dynamic"):
                  selection = ["/usr/bin/security", "list-keychains"]
                  if domain != "default":
                      selection += ["-d", domain]
                  selection += ["-s", keychain, "/System/Library/Keychains/SystemRootCertificates.keychain"]
                  updated = subprocess.run(selection, check=False, capture_output=True, text=True)
                  print("SEARCH LIST", domain, "update exit", updated.returncode, flush=True)
                  candidate = variants[-1][1]
                  result = subprocess.run(candidate, **dict(kwargs, check=False))
                  markers = [text for text in ("errSecInternalComponent", "unable to build chain",
                             "User interaction is not allowed", "not found", "could not be found")
                             if text.lower() in result.stderr.lower()]
                  print("SIGNING AFTER SEARCH UPDATE", domain, "exit", result.returncode,
                        "diagnostics", markers, flush=True)
                  if result.returncode == 0:
                      success = candidate
              if success is None:
                  raise RuntimeError("All signing variants failed.")
              return subprocess.run(success, **kwargs)

          prepare_ios_signing.prepare_signing(
              Path(os.environ["CI_KEYCHAIN"] + ".keychain"),
              Path.home() / "Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision",
              Path(os.environ["RUNNER_TEMP"]), diagnose)
          PY
      - name: Remove temporary signing keychain
        if: ${{ always() && steps.signing-keychain.outcome == 'success' }}
        run: |
          if [[ -f "$CI_KEYCHAIN.keychain-db" ]]; then
            security delete-keychain "$CI_KEYCHAIN.keychain"
          fi
